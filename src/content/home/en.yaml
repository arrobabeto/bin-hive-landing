    - id: memory
      value: "90 days"
      caption: "of memory without repeating ideas"
    - id: questions
      value: "≤4"
      caption: "questions per round, only when something is missing"

trust:
  eyebrow: "Control"
  heading: "AI proposes. You decide what goes live."
  body: "Bin Hive was born to produce @arrobabeto's content every single day. That's why it's built to work with you, not instead of you."
  items:
    - id: approve
      text: "You approve every piece before it's published."
    - id: no_autopublish
      text: "It never posts to your networks on its own."
    - id: no_invent
      text: "It never makes up product facts: it flags what's missing so you can confirm it."
    - id: isolated
      text: "The writer and the reviewer work with separate contexts."

faq:
  eyebrow: "FAQ"
  heading: "Frequently asked questions about Bin Hive."
  items:
    - id: what
      question: "What is Bin Hive?"
      answer: "Bin Hive is an apiary of AI agents for social media. It turns one idea into ideas, hooks, scripts and captions for Instagram, TikTok, YouTube Shorts and X, with a specialized hive for each network."
    - id: publish
      question: "Does it post for me?"
      answer: "No. Bin Hive prepares the pieces and you decide what gets recorded and published. Publishing is manual on purpose."
    - id: generic
      question: "Will the content sound like AI?"
      answer: "Every piece goes through a tone review with a list of banned phrases typical of AI-generated text. On top of that, you edit and approve everything before it goes live."
    - id: agencies
      question: "Does it work for an agency with many clients?"
      answer: "Yes. Your agency account groups one profile per client, each with its own voice, goals and hives, and you plan everything from one place."
    - id: networks
      question: "Which social networks does it support?"
      answer: "Instagram (Reels), TikTok, YouTube Shorts and X. Each has its own hive, and more networks can be added later."
    - id: release
      question: "When can I use it?"
      answer: "We're preparing the release. Join the waitlist and you'll be the first to know when we open spots."
    - id: price
      question: "How much does it cost?"
      answer: "Plans will be announced with the release. People on the waitlist will see them before anyone else."

