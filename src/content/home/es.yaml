trust:
  eyebrow: "Control"
  heading: "La IA propone. Tú decides qué sale al aire."
  body: "Bin Hive nació para producir el contenido de @arrobabeto todos los días. Por eso está hecho para trabajar contigo, no en tu lugar."
  items:
    - id: approve
      text: "Apruebas cada pieza antes de publicarla."
    - id: no_autopublish
      text: "No publica por su cuenta en tus redes."
    - id: no_invent
      text: "Nunca inventa datos de tus productos: marca lo que falta para que lo confirmes."
    - id: isolated
      text: "La escritora y la revisora trabajan con contextos separados."

faq:
  eyebrow: "Preguntas frecuentes"
  heading: "Preguntas frecuentes sobre Bin Hive."
  items:
    - id: what
      question: "¿Qué es Bin Hive?"
      answer: "Bin Hive es un apiario de agentes de IA para redes sociales. Convierte una idea en ideas, hooks, guiones y copies para Instagram, TikTok, YouTube Shorts y X, con una colmena especializada por red."
    - id: publish
      question: "¿Publica por mí?"
      answer: "No. Bin Hive prepara las piezas y tú decides qué se graba y qué se publica. La publicación es manual a propósito."
    - id: generic
      question: "¿El contenido va a sonar a IA?"
      answer: "Cada pieza pasa por una revisión de tono con una lista de frases prohibidas típicas del texto generado por IA. Además, tú editas y apruebas todo antes de publicar."
    - id: agencies
      question: "¿Sirve para una agencia con varios clientes?"
      answer: "Sí. Tu cuenta de agencia agrupa un perfil por cliente, cada uno con su voz, sus objetivos y sus colmenas, y planificas todo desde un solo lugar."
    - id: networks
      question: "¿Qué redes sociales soporta?"
      answer: "Instagram (Reels), TikTok, YouTube Shorts y X. Cada una tiene su propia colmena y se pueden sumar más redes después."
    - id: release
      question: "¿Cuándo puedo usarlo?"
      answer: "Estamos preparando el release. Anótate en la lista de espera y te avisamos primero cuando abramos lugares."
    - id: price
      question: "¿Cuánto cuesta?"
      answer: "Los planes se anunciarán con el release. Quienes estén en la lista de espera los conocerán antes que nadie."

