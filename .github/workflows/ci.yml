name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # CI only compiles and verifies (never deploys): placeholder values satisfy
      # astro:env validation. Real values live only in Vercel.
      MAILERLITE_API_KEY: ci-build-only-placeholder-key
      PUBLIC_MAILERLITE_GROUP_ID: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm run check

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: BSI gate
        run: pnpm run check:bsi
